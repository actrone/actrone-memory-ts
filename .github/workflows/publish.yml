name: Publish to npm

# Publishes actrone-memory to the npm registry on a version tag (vX.Y.Z). The tag's
# version must match package.json "version"; the "Verify tag matches package.json
# version" step below enforces that before anything is uploaded.
#
# Supply-chain posture: npm OIDC Trusted Publishing, so there is no long-lived
# NPM_TOKEN. GitHub's OIDC identity authenticates the publish with short-lived,
# workflow-scoped credentials, and npm provenance attaches a Sigstore-signed
# attestation linking the tarball to this repo, commit and workflow (public
# transparency log). Requires a public repo, `id-token: write`, and a Trusted
# Publisher configured for this package on npmjs.com.
#
# Every third-party action is pinned to an exact commit SHA (release tag in the trailing
# comment), because this job holds `id-token: write`. The `npm` environment adds a required
# reviewer before anything publishes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # OIDC trusted publishing + provenance, and creating the GitHub Release for this tag
  id-token: write # OIDC trusted publishing + provenance, no signing key, no token
  actions: read # read the CI run's conclusion for this commit

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    # Waits for a required reviewer before it can publish. The same name must be set as the
    # trusted publisher's "Environment name" on npmjs.com, so no other job can publish.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `prepublishOnly` re-runs typecheck + test + build, but not CodeQL or the
      # dependency audit. Without this gate, tagging a commit whose CI went red still
      # publishes. Require the CI run for this exact commit to have concluded green.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "missing"')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for ${GITHUB_SHA} is '${CONCLUSION}', refusing to publish. Tag a commit whose CI passed on main."
            exit 1
          fi
          echo "CI passed for ${GITHUB_SHA}."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm CLI >= 11.5.1; Node 22 ships an older npm. Pinned exactly,
      # not @latest: `latest` moved to npm 12 in 2026, and the job that holds publish rights should
      # not pick up a new major on release day. Bump deliberately.
      - name: Upgrade npm (trusted publishing)
        run: npm install -g npm@11.19.1

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      # `npm publish` only refuses a version that is ALREADY on the registry; a tag that drifted
      # from package.json (e.g. someone forgot to bump it) would otherwise publish silently under
      # the wrong version while the GitHub Release still claims the tag name. Fail loudly instead.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # `prepublishOnly` (typecheck + test + build) runs automatically as the publish
      # gate, so a failing check aborts the publish. The package is unscoped (`actrone-memory`),
      # so it is public by default and needs no --access flag; --provenance attaches the signed
      # attestation. No NODE_AUTH_TOKEN: authentication is via the OIDC trusted publisher.
      - name: Publish
        run: npm publish --provenance

      - name: Create GitHub Release
        # Publishing to npm on a tag push was previously the only artifact of a release: no
        # GitHub Release object, so the repo's Releases tab stayed empty and there was nowhere to
        # read what changed between versions without diffing CHANGELOG.md by hand. Auto-generated
        # notes (from merged PRs since the previous tag) need no extra maintenance.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }} # SemVer pre-release suffix, e.g. v1.0.0-rc.1
