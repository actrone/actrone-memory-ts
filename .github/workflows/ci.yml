name: CI

# Type-check, test, and build actrone-memory on every push/PR to main, the same gate
# `prepublishOnly` enforces at publish time, run early so a break is caught on the PR.
#
# NOTE (CI hardening): third-party actions are pinned to release tags for readability;
# repin to exact commit SHAs per workspace policy before enabling.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-test-build:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type-check (tsc, strict)
        run: npm run typecheck
      - name: Test (vitest)
        run: npm test
      - name: Build (tsup)
        run: npm run build
      - name: Generate API reference (TypeDoc)
        # Gates the docs: a broken doc-comment, @link, or entry point fails the build
        # (API reference generated from the package source).
        run: npm run docs:api
      - name: Type-check docs examples (Phase 6 item 5)
        # The guide snippets are real, compiled example files, an API change that breaks a documented
        # snippet fails here before it can ship stale.
        run: npm run typecheck:examples
      - name: Verify extracted snippets are in sync
        run: npm run snippets:check
      - name: check-compat, framework peer/README drift gate
        # Fails if optional peerDependencies / the README compatibility matrix drift from
        # compatibility.json (the SSOT).
        run: npm run check-compat

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high
