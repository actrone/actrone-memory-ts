# Secret scan (CLAUDE.md section 5.3): gitleaks over the full history on every pull request and every push
# to main, so a secret that got past a skipped or missing pre-commit hook (.githooks/pre-commit) still
# fails. The binary is the official release, pinned and checked against its published SHA-256
# (https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1, the latest stable release, checked
# 2026-11-21). Reviewed false positives are listed by fingerprint in .gitleaksignore, so the same text
# anywhere else still fails.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
