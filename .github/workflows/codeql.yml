name: "CodeQL"

# GitHub's semantic SAST for the TypeScript source: closes a real gap, since ci.yml type-checks
# and tests the code but runs no static security analysis on it at all. Complementary to the
# dependency-vulnerability check in ci.yml's `security` job (that catches known-vulnerable
# packages; this catches vulnerabilities in our own code, e.g. tainted data flowing from an
# untrusted source into a sink). Free for public repositories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push: new CodeQL query packs land continuously, so a repo with
    # no commits in a given week still gets scanned against the latest rules.
    - cron: "30 3 * * 1"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the repo's Security tab
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none # source-only analysis, no compile step required for JS/TS

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
